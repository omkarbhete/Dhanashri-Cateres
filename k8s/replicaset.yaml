apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: new-dhanashri-catering
  labels:
    app: new-dhanashri-catering
spec:
  replicas: 3
  selector:
    matchLabels:
      app: new-dhanashri-catering
  template:
    metadata:
      labels:
        app: new-dhanashri-catering
    spec:
      containers:
        - name: web
          image: YOUR_DOCKERHUB_USERNAME/new-dhanashri-catering:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: new-dhanashri-catering
spec:
  type: NodePort
  selector:
    app: new-dhanashri-catering
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
